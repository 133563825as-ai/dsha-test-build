name: Build installable debug APK (fork CI)

# FORK-ONLY harness. Lives in the temporary repo 133563825as-ai/dsha-test-build.
# It never touches DSH-APP/DSHA (read-only checkout of a pinned commit).
#
# Deviations from the upstream package job (see ci/FORK-NOTES.md):
#   1. source comes in as a patch applied on DSH-APP/DSHA@70e37a7;
#   2. offline inputs are unpacked by ci/unpack-inputs.py instead of
#      tools/ci-assets.py --url, because the stock script's verify_sources()
#      is unsatisfiable with this bundle (descriptor pins the 304 MB source
#      rootfs / does not register python-support.bin + adb-wheels.tar.gz);
#   3. :app:verifyRuntimeDescriptorInputs and :app:prepareRuntimeDescriptor
#      are excluded, for the same reason;
#   4. no NDK is installed and no release keystore is used: debug builds are
#      signed with the standard Android debug keystore, so the APK installs
#      directly on a device.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: DSH-APP/DSHA
  # Must be the full 40-char SHA: actions/checkout treats a short SHA as a branch name.
  UPSTREAM_COMMIT: 70e37a7dbcae83b32fc92a8a37b33af88befc0e0
  INPUT_URL: https://github.com/133563825as-ai/dsha-test-build/releases/download/inputs/inputs.zip
  INPUT_SHA256: d28dd34804edc1623fab5760cf8dd7221ef17d974b6bf7792f3f5527a2a2e604

jobs:
  standard-debug:
    name: assembleStandardDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch upstream source at the pinned base commit (read-only, no token)
        run: |
          set -euo pipefail
          git init -q dsha
          cd dsha
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q --depth=1 origin "${UPSTREAM_COMMIT}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          git log --oneline -1
      - name: Apply the four-fix patch
        working-directory: dsha
        run: |
          set -euo pipefail
          git apply --verbose "${GITHUB_WORKSPACE}/ci/patches/dsha-four-fixes.patch"
          git status --short
      - name: Verify toolchain against source configuration
        id: toolchain
        working-directory: dsha
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Android SDK
        working-directory: dsha
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;$(python3 tools/ci-toolchain.py --field androidPlatform)" \
                     "build-tools;$(python3 tools/ci-toolchain.py --field buildTools)"
      - name: Download and unpack the hosted offline inputs
        working-directory: dsha
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/ci/unpack-inputs.py" \
            --url "$INPUT_URL" --sha256 "$INPUT_SHA256" --root .
      - name: Assemble standard debug APK
        working-directory: dsha
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug \
            -x :app:verifyRuntimeDescriptorInputs \
            -x :app:prepareRuntimeDescriptor \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "${GITHUB_WORKSPACE}/assemble-standard-debug.log"
      - name: Summarize output
        if: always()
        run: |
          find dsha/app/build/outputs/apk -name '*.apk' -printf '%s\t%p\n' 2>/dev/null | sort -n || true
          find dsha/app/build/outputs/apk -name '*.apk' -exec sha256sum {} + 2>/dev/null || true
      - name: Upload APK or logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsha-standard-debug-apk
          path: |
            dsha/app/build/outputs/apk/**/*.apk
            assemble-standard-debug.log
          if-no-files-found: warn
          retention-days: 7

  low-debug:
    name: assembleLowDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch upstream source at the pinned base commit (read-only, no token)
        run: |
          set -euo pipefail
          git init -q dsha
          cd dsha
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q --depth=1 origin "${UPSTREAM_COMMIT}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          git log --oneline -1
      - name: Apply the four-fix patch
        working-directory: dsha
        run: |
          set -euo pipefail
          git apply --verbose "${GITHUB_WORKSPACE}/ci/patches/dsha-four-fixes.patch"
      - name: Verify toolchain against source configuration
        id: toolchain
        working-directory: dsha
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Android SDK
        working-directory: dsha
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;$(python3 tools/ci-toolchain.py --field androidPlatform)" \
                     "build-tools;$(python3 tools/ci-toolchain.py --field buildTools)"
      - name: Download and unpack the hosted offline inputs
        working-directory: dsha
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/ci/unpack-inputs.py" \
            --url "$INPUT_URL" --sha256 "$INPUT_SHA256" --root .
      - name: Assemble low debug APK
        working-directory: dsha
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleLowDebug \
            -x :app:verifyRuntimeDescriptorInputs \
            -x :app:prepareRuntimeDescriptor \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "${GITHUB_WORKSPACE}/assemble-low-debug.log"
      - name: Summarize output
        if: always()
        run: |
          find dsha/app/build/outputs/apk -name '*.apk' -printf '%s\t%p\n' 2>/dev/null | sort -n || true
          find dsha/app/build/outputs/apk -name '*.apk' -exec sha256sum {} + 2>/dev/null || true
      - name: Upload APK or logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsha-low-debug-apk
          path: |
            dsha/app/build/outputs/apk/**/*.apk
            assemble-low-debug.log
          if-no-files-found: warn
          retention-days: 7

  fix-unit-tests:
    name: unit tests for the four fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout fork harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch upstream source at the pinned base commit (read-only, no token)
        run: |
          set -euo pipefail
          git init -q dsha
          cd dsha
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q --depth=1 origin "${UPSTREAM_COMMIT}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          git log --oneline -1
      - name: Apply the four-fix patch
        working-directory: dsha
        run: |
          set -euo pipefail
          git apply --verbose "${GITHUB_WORKSPACE}/ci/patches/dsha-four-fixes.patch"
      - name: Verify toolchain against source configuration
        id: toolchain
        working-directory: dsha
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Android SDK
        working-directory: dsha
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;$(python3 tools/ci-toolchain.py --field androidPlatform)" \
                     "build-tools;$(python3 tools/ci-toolchain.py --field buildTools)"
      - name: Run debug unit tests without offline package generation
        working-directory: dsha
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest \
            -x :app:verifyRuntimeDescriptorInputs \
            -x :app:prepareRuntimeDescriptor \
            -x :app:prepareStandardAssets \
            -x :app:prepareRecoveryAssets \
            --tests '*PictureInPicturePolicyTest' \
            --tests '*VirtualScreenPolicyTest' \
            --tests '*VirtualScreenGenerationSyncTest' \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "${GITHUB_WORKSPACE}/fix-unit-tests.log"
      - name: Upload test report or logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsha-fix-unit-tests
          path: |
            dsha/app/build/reports/tests
            dsha/app/build/test-results
            fix-unit-tests.log
          if-no-files-found: warn
          retention-days: 7
