name: Diagnose AGP debug keystore resolution (fork CI)

# FORK-ONLY, dispatch-only, no APK build. Answers two questions with evidence
# instead of guesses:
#   A. does AGP accept a legacy JKS keystore (alias "androiddebugkey") placed at
#      $HOME/.android/debug.keystore, or does it silently create another one?
#   B. same question for the keystore this repo now pins (PKCS12, alias
#      "AndroidDebugKey"), and where does AGP think the file should live?
#
# `ValidateSigningTask.createDefaultDebugKeystoreIfNeeded()` is the code path
# that creates the debug store, and it logs "Creating default debug keystore
# at {}" at INFO level, so this runs the validate-signing task with --info and
# then lists every debug.keystore left on disk.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: DSH-APP/DSHA
  UPSTREAM_COMMIT: 70e37a7dbcae83b32fc92a8a37b33af88befc0e0
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
  CMDLINE_TOOLS_SHA256: 0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch upstream source at the pinned base commit
        run: |
          set -euo pipefail
          git init -q dsha
          cd dsha
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q --depth=1 origin "${UPSTREAM_COMMIT}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
      - name: Apply the patch
        working-directory: dsha
        run: |
          set -euo pipefail
          git apply --verbose "${GITHUB_WORKSPACE}/ci/patches/dsha-four-fixes.patch"
      - name: Add the Linux AAPT2 checksum
        working-directory: dsha
        run: python3 "${GITHUB_WORKSPACE}/ci/patch-verification-metadata.py"
      - name: Verify toolchain against source configuration
        id: toolchain
        working-directory: dsha
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$HOME/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          echo "${CMDLINE_TOOLS_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -
          unzip -q -o /tmp/cmdline-tools.zip -d "$sdk_root/cmdline-tools"
          rm -rf "$sdk_root/cmdline-tools/latest"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Phase A and B - which keystore does AGP actually use
        working-directory: dsha
        run: |
          set -uo pipefail
          chmod +x gradlew
          mkdir -p "${GITHUB_WORKSPACE}/diag"
          echo "HOME=$HOME  GRADLE_USER_HOME=${GRADLE_USER_HOME:-<unset>}  XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>} ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}"
          ./gradlew :app:tasks --all -q --no-daemon 2>/dev/null | grep -oE 'validateSigning[A-Za-z]+' | sort -u > /tmp/tasks.txt || true
          cat /tmp/tasks.txt
          TASK=$(grep -m1 'StandardDebug' /tmp/tasks.txt || true)
          [ -n "$TASK" ] || TASK=validateSigningStandardDebug
          echo "chosen task: $TASK"
          report() {
            echo "----- filesystem state ($1) -----"
            find /home /root /opt /usr/local /tmp -name 'debug.keystore' 2>/dev/null | while read -r f; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $f"
              keytool -list -v -keystore "$f" -storepass android 2>/dev/null \
                | grep -E "Alias name|Store type|SHA256:" | sed 's/^/      /' || true
            done
            echo "----- AGP log lines ($1) -----"
            grep -iE "Creating default debug keystore|debug keystore|No key with alias" "/tmp/$2" | head -20 || true
          }
          for phase in "A:${GITHUB_WORKSPACE}/ci/debug-legacy-jks.keystore:legacy JKS + alias androiddebugkey" \
                       "B:${GITHUB_WORKSPACE}/ci/debug.keystore:PKCS12 + alias AndroidDebugKey"; do
            name=${phase%%:*}; rest=${phase#*:}; src=${rest%%:*}; label=${rest#*:}
            echo "############ PHASE $name - $label"
            mkdir -p "$HOME/.android"
            install -m 600 "$src" "$HOME/.android/debug.keystore"
            echo "installed sha256: $(sha256sum "$HOME/.android/debug.keystore" | cut -d' ' -f1)"
            ./gradlew ":app:$TASK" --info --no-daemon --max-workers=2 \
              -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets \
              -x :app:verifyRuntimeDescriptorInputs -x :app:prepareRuntimeDescriptor \
              > "/tmp/phase-$name.log" 2>&1 || echo "gradle exit=$?"
            report "$name" "phase-$name.log"
          done
          cp /tmp/phase-A.log /tmp/phase-B.log /tmp/tasks.txt "${GITHUB_WORKSPACE}/diag/" || true
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agp-debug-keystore-diagnostic
          path: diag/
          if-no-files-found: warn
          retention-days: 7
